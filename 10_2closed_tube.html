<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>片端閉管はなぜ λ = 4L か</title>
<style>
  :root{
    --bg:#eef2f3; --panel:#ffffff; --ink:#26333a; --sub:#6b7a80;
    --air:#f5f9fa; --tubewall:#8fa3aa; --closed:#4a5c63; --open:#bcd0d6;
    --real:#1f7a8c; --realfill:rgba(31,122,140,0.12);
    --ghost:#c48a5a; --accent:#1f7a8c; --hl:#e07a3f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background:var(--bg);color:var(--ink);padding:20px;line-height:1.65;}
  .wrap{max-width:940px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 4px;}
  .lead{color:var(--sub);font-size:14px;margin:0 0 16px;}
  .stage{background:var(--panel);border-radius:12px;padding:14px 14px 6px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);}
  svg{display:block;width:100%;height:auto;}
  .controls{background:var(--panel);border-radius:12px;padding:16px 18px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);margin:16px 0;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  button{font-family:inherit;font-size:14px;padding:8px 15px;border-radius:8px;
    border:1px solid #cdd8dc;background:#fff;color:var(--ink);cursor:pointer;transition:.15s;}
  button:hover{background:#eef4f5;}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  button:disabled{opacity:.4;cursor:default;}
  .legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .chip{width:16px;height:0;border-top-width:3px;border-top-style:solid;display:inline-block;}
  .note{background:#eef6f7;border-left:4px solid var(--accent);padding:12px 16px;
    border-radius:4px;font-size:13px;color:#2b555e;margin-top:16px;}
  .note b{color:var(--accent);}
  .count{font-size:13px;color:var(--sub);margin-left:8px;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div class="wrap">
  <h1>片端閉管はなぜ 波長 = 管の長さ × 4 か</h1>
  <p class="lead">管の中にあるのは基本振動の「4分の1」だけ。折り返しながら4つ分つなぐと、ようやく1回分（1波長）になる。</p>

  <div class="stage">
    <svg id="plot" viewBox="0 0 900 260" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend">
      <span><span class="chip" style="border-top-color:var(--real)"></span>管の中の実際の共鳴（1/4波長）</span>
      <span><span class="chip" style="border-top-color:var(--ghost);border-top-style:dashed"></span>波長を測るための延長（仮想）</span>
    </div>
  </div>

  <div class="controls">
    <div class="btnrow">
      <button id="add" class="on">延長を1つ足す ＋</button>
      <button id="back">1つ戻す −</button>
      <button id="full">一気に4つ（1波長）</button>
      <button id="reset">最初に戻す</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="note" id="note"></div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('plot');
const VW=900, VH=260;
const yMid=140;
const AMP=60;
const L_cm=17;                 // tube length in cm
const segPx=170;               // pixels per quarter-wave segment
const x0=60;                   // left edge of tube (closed end)
const tubeTop=yMid-AMP-16, tubeH=2*(AMP+16);

let segs=1;                    // how many quarter-wave segments are shown (1..4)

const ui={
  add:document.getElementById('add'),
  back:document.getElementById('back'),
  full:document.getElementById('full'),
  reset:document.getElementById('reset'),
  count:document.getElementById('count'),
  note:document.getElementById('note'),
};

function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e;}
function clear(){while(svg.firstChild)svg.removeChild(svg.firstChild);}

// pressure shape as function of segment-position s in [0, segs] (each unit = quarter wave)
// p(s)=cos(pi/2 * s): s=0 ->1 (antinode), s=1 ->0 (node), s=2 ->-1, s=3->0, s=4->1
function pAt(s){ return Math.cos(Math.PI/2*s); }

function draw(){
  clear();

  // --- tube body (only the first segment is the real tube) ---
  svg.appendChild(el('rect',{x:x0,y:tubeTop,width:segPx,height:tubeH,rx:6,
    fill:'var(--air)',stroke:'var(--tubewall)','stroke-width':1.5}));
  // closed end (left) solid wall
  svg.appendChild(el('rect',{x:x0-6,y:tubeTop-2,width:8,height:tubeH+4,rx:2,fill:'var(--closed)'}));
  // open end (right of first segment) faint bars
  for(let i=0;i<3;i++){
    svg.appendChild(el('line',{x1:x0+segPx-2+i*3,y1:tubeTop-4,x2:x0+segPx-2+i*3,y2:tubeTop+tubeH+4,
      stroke:'var(--open)','stroke-width':2,opacity:0.7-i*0.2}));
  }

  // baseline across whole shown range
  const xEnd=x0+segs*segPx;
  svg.appendChild(el('line',{x1:x0,y1:yMid,x2:xEnd,y2:yMid,stroke:'#cdd8dc','stroke-width':1}));

  // --- real segment (s in [0,1]) : solid, filled ---
  function pathForRange(sStart,sEnd){
    let d='';
    const N=120;
    for(let i=0;i<=N;i++){
      const s=sStart+(sEnd-sStart)*i/N;
      const xp=x0+s*segPx;
      const y=yMid - AMP*pAt(s);
      d+=(i===0?'M':'L')+xp.toFixed(1)+' '+y.toFixed(1)+' ';
    }
    return d;
  }
  // filled area for the real quarter-wave
  let df='M'+x0+' '+yMid+' '+pathForRange(0,1).slice(1)+ 'L'+(x0+segPx)+' '+yMid+' Z';
  svg.appendChild(el('path',{d:df,fill:'var(--realfill)',stroke:'none'}));
  svg.appendChild(el('path',{d:pathForRange(0,1),fill:'none',stroke:'var(--real)','stroke-width':3}));

  // --- ghost extension segments (s in [1, segs]) : dashed ---
  if(segs>1){
    svg.appendChild(el('path',{d:pathForRange(1,segs),fill:'none',
      stroke:'var(--ghost)','stroke-width':2.4,'stroke-dasharray':'6 5'}));
  }

  // --- segment boundary ticks + node/antinode dots at each quarter ---
  for(let sB=0;sB<=segs;sB++){
    const xp=x0+sB*segPx;
    // vertical light divider
    svg.appendChild(el('line',{x1:xp,y1:tubeTop-6,x2:xp,y2:tubeTop+tubeH+6,
      stroke:'#dce6e9','stroke-width':1,'stroke-dasharray':'2 4'}));
    // node (value 0) or antinode marker
    const v=pAt(sB);
    if(Math.abs(v)<0.001){
      svg.appendChild(el('circle',{cx:xp,cy:yMid,r:4,fill:'var(--hl)'}));
    }
    // quarter labels 1/4,2/4,3/4,4/4 under axis
    if(sB>0){
      const lab=el('text',{x:x0+(sB-0.5)*segPx,y:yMid+AMP+40,'font-size':12,
        fill:'var(--sub)','text-anchor':'middle'});
      lab.textContent='¼';
      svg.appendChild(lab);
    }
  }

  // --- length brackets ---
  // tube length L under first segment
  bracket(x0, x0+segPx, tubeTop-30, 'L = '+L_cm+' cm', 'var(--real)');
  // wavelength bracket when full
  if(segs===4){
    bracket(x0, x0+4*segPx, yMid+AMP+62, 'λ = 4L = '+(4*L_cm)+' cm', 'var(--ghost)');
  }

  updateNote();
  ui.count.textContent = segs+' / 4 ぶん'+(segs===4?'（1波長 完成）':'');
  ui.add.disabled = segs>=4;
  ui.back.disabled = segs<=1;
}

function bracket(xa,xb,y,label,color){
  svg.appendChild(el('line',{x1:xa,y1:y,x2:xb,y2:y,stroke:color,'stroke-width':1.5}));
  svg.appendChild(el('line',{x1:xa,y1:y-5,x2:xa,y2:y+5,stroke:color,'stroke-width':1.5}));
  svg.appendChild(el('line',{x1:xb,y1:y-5,x2:xb,y2:y+5,stroke:color,'stroke-width':1.5}));
  const tx=el('text',{x:(xa+xb)/2,y:y-8,'font-size':13,fill:color,'text-anchor':'middle','font-weight':700});
  tx.textContent=label; svg.appendChild(tx);
}

function updateNote(){
  if(segs===1){
    ui.note.innerHTML='管の中にあるのは、基本振動の<b>4分の1</b>だけ（左端が音圧の腹、右端が音圧の節）。'+
      'これだけでは波の「1回分」になっていない。「延長を1つ足す」で先を見てみよう。';
  }else if(segs<4){
    ui.note.innerHTML=`いま <b>${segs}/4</b> ぶん。折り返しながらつなぐと、まだ1回分に届かない。`+
      'あと'+(4-segs)+'つで1波長。';
  }else{
    ui.note.innerHTML='<b>4つ分</b>でようやく波の1回分（1波長）が完成。'+
      'つまり管の長さ L は波長の4分の1 → <b>λ = 4L = '+(4*L_cm)+' cm</b>。'+
      'だから f = c / λ = 34000 / '+(4*L_cm)+' = <b>500 Hz</b>。';
  }
}

ui.add.addEventListener('click',()=>{ if(segs<4){segs++;draw();} });
ui.back.addEventListener('click',()=>{ if(segs>1){segs--;draw();} });
ui.full.addEventListener('click',()=>{ segs=4;draw(); });
ui.reset.addEventListener('click',()=>{ segs=1;draw(); });

draw();
</script>
</body>
</html>
