<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>複合音の合成と分析 ― 波形とスペクトル</title>
<style>
  :root {
    --ink: #23201b;
    --paper: #f7f4ee;
    --card: #ffffff;
    --line: #e3ddd2;
    --muted: #8a8272;
    --sum: #b2402c;      /* 合成波形（時間領域） */
    --accent: #2f5d7c;   /* 見出し・UI */
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    background: var(--paper); color: var(--ink);
    margin: 0; padding: 24px 16px;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 21px; font-weight: 700; margin: 0 0 4px; letter-spacing: .01em; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; text-align: center; max-width: 640px; line-height: 1.6; }
  #stage {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 4px 18px rgba(40,34,24,0.06);
    max-width: 100%; height: auto;
  }
  .lane-label { font-size: 11px; fill: var(--muted); font-weight: 600; letter-spacing:.04em; }
  .buttons { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    padding: 8px 15px; border: 1px solid transparent; border-radius: 7px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s;
    font-family: inherit;
  }
  .preset { background: #efeadf; color: #55503f; border-color: #e0d9ca; }
  .preset:hover { background: #e6dfd0; }
  .sound { background: #2f7d54; color: #fff; }
  .sound.off { background: #a49b88; }
  .sound:hover { filter: brightness(1.05); }
  .panel { margin-top: 20px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .harmonic { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: #555; min-width: 118px; }
  .harmonic .name { font-weight: 700; margin-bottom: 6px; }
  .harmonic input[type=range] { width: 112px; accent-color: var(--accent); }
  .harmonic .amp { font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .caption { margin-top: 16px; font-size: 12px; color: var(--muted); max-width: 640px; text-align: center; line-height: 1.7; }
  .caption b { color: var(--ink); }
</style>
</head>
<body>
  <h1>複合音の合成と分析</h1>
  <div class="sub">左＝時間で見た波形（合成）、右＝周波数で見たスペクトル（分析）。スライダーで各倍音の振幅を変えると、両方が同時に動く。同じ音の「表と裏」。</div>

  <svg id="stage" viewBox="0 0 900 470" width="900" height="470" xmlns="http://www.w3.org/2000/svg">
    <!-- ===== LEFT: component waves + sum (time domain) ===== -->
    <text x="24" y="26" class="lane-label">成分（各倍音の純音）</text>
    <g id="components"></g>

    <line x1="24" y1="262" x2="560" y2="262" stroke="#e8e2d6" stroke-width="1"/>
    <text x="24" y="286" class="lane-label">合成された複合音 ＝ すべての成分の和（時間波形）</text>
    <line x1="44" y1="380" x2="556" y2="380" stroke="#d8d1c3" stroke-width="1"/>
    <path id="sumWave" fill="none" stroke="var(--sum)" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- vertical divider between 合成 and 分析 -->
    <line x1="600" y1="20" x2="600" y2="450" stroke="#ece6da" stroke-width="1.5"/>

    <!-- ===== RIGHT: line spectrum (frequency domain) ===== -->
    <text x="628" y="26" class="lane-label">スペクトル（周波数で見た成分＝線スペクトル）</text>
    <g id="spectrum"></g>
    <!-- spectrum baseline -->
    <line id="specBase" x1="656" y1="400" x2="876" y2="400" stroke="#c9c2b3" stroke-width="1.5"/>
    <text x="656" y="420" font-size="11" fill="#a89f8c">f</text>
    <text x="708" y="420" font-size="11" fill="#a89f8c">2f</text>
    <text x="760" y="420" font-size="11" fill="#a89f8c">3f</text>
    <text x="812" y="420" font-size="11" fill="#a89f8c">4f</text>
    <text x="628" y="444" font-size="11" fill="#a89f8c">→ 周波数（低い ← → 高い）</text>
  </svg>

  <div class="buttons">
    <button id="soundBtn" class="sound off">🔇 音を鳴らす</button>
    <button class="preset" data-preset="fundamental">基本振動のみ</button>
    <button class="preset" data-preset="saw">のこぎり波風</button>
    <button class="preset" data-preset="square">矩形波風（奇数倍音）</button>
    <button class="preset" data-preset="clear">リセット</button>
  </div>

  <div class="panel" id="panel"></div>

  <div class="caption">
    <b>のこぎり波風</b>＝全倍音を 1, 1/2, 1/3, 1/4 で。<b>矩形波風</b>＝奇数倍音だけ（第2・第4はゼロ）。
    高い倍音ほど量が小さいのがふつう。同じ高さ（同じ f）でも倍音の割合が変われば<b>音色</b>が変わる。
  </div>

<script>
const NH = 4;
const colors = ['#2f5d7c', '#c98a2b', '#3a8a5a', '#9a5aa0'];
const names  = ['基本振動 (f)', '第2倍音 (2f)', '第3倍音 (3f)', '第4倍音 (4f)'];
let amps = [1.0, 0.0, 0.0, 0.0];

const componentsG = document.getElementById('components');
const spectrumG   = document.getElementById('spectrum');
const sumWave     = document.getElementById('sumWave');
const panel       = document.getElementById('panel');

// ---- left: component lanes (time) ----
const laneX0 = 44, laneX1 = 556, laneH = 52, laneTop = 40;
const baseF = 2; // cycles across view for fundamental
const compAmpPx = 17, sumAmpScale = 30, sumCy = 380;

const compPaths = [];
for (let i = 0; i < NH; i++) {
  const cy = laneTop + i * laneH + laneH/2;
  const axis = document.createElementNS('http://www.w3.org/2000/svg','line');
  axis.setAttribute('x1', laneX0); axis.setAttribute('y1', cy);
  axis.setAttribute('x2', laneX1); axis.setAttribute('y2', cy);
  axis.setAttribute('stroke', '#f0ebe0'); axis.setAttribute('stroke-width', '1');
  componentsG.appendChild(axis);

  const label = document.createElementNS('http://www.w3.org/2000/svg','text');
  label.setAttribute('x', laneX0); label.setAttribute('y', cy - laneH/2 + 5);
  label.setAttribute('font-size', '11'); label.setAttribute('fill', colors[i]);
  label.setAttribute('font-weight','600');
  label.textContent = names[i];
  componentsG.appendChild(label);

  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('fill','none'); p.setAttribute('stroke', colors[i]); p.setAttribute('stroke-width','1.8');
  componentsG.appendChild(p);
  compPaths.push({path:p, cy:cy});
}

// ---- right: spectrum bars (frequency) ----
const specX = [656, 708, 760, 812]; // bar x positions (f,2f,3f,4f)
const specBaseY = 400, specMaxH = 300, specW = 22;
const specBars = [];
for (let i = 0; i < NH; i++) {
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x', specX[i] - specW/2);
  rect.setAttribute('width', specW);
  rect.setAttribute('fill', colors[i]);
  rect.setAttribute('rx', '2');
  spectrumG.appendChild(rect);
  specBars.push(rect);
}

// ---- sliders ----
for (let i = 0; i < NH; i++) {
  const div = document.createElement('div');
  div.className = 'harmonic';
  div.innerHTML = `
    <div class="name" style="color:${colors[i]}">${names[i]}</div>
    <input type="range" min="0" max="100" value="${amps[i]*100}" id="amp${i}">
    <div class="amp" id="ampVal${i}"></div>`;
  panel.appendChild(div);
  document.getElementById('amp'+i).addEventListener('input', (e) => {
    amps[i] = +e.target.value / 100;
    draw(); updateAudio();
  });
}

function draw() {
  // components (time)
  for (let i = 0; i < NH; i++) {
    const cy = compPaths[i].cy, harm = i + 1;
    let d = '';
    for (let x = laneX0; x <= laneX1; x += 2) {
      const phase = (x - laneX0) / (laneX1 - laneX0) * 2*Math.PI * baseF * harm;
      const y = cy - amps[i] * compAmpPx * Math.sin(phase);
      d += (x===laneX0?'M':'L') + x + ' ' + y.toFixed(1) + ' ';
    }
    compPaths[i].path.setAttribute('d', d);
    document.getElementById('ampVal'+i).textContent = '振幅 ' + Math.round(amps[i]*100) + '%';
  }
  // sum (time)
  let d = '';
  for (let x = laneX0; x <= laneX1; x += 2) {
    let y = 0;
    for (let i = 0; i < NH; i++) {
      const harm = i + 1;
      const phase = (x - laneX0) / (laneX1 - laneX0) * 2*Math.PI * baseF * harm;
      y += amps[i] * Math.sin(phase);
    }
    d += (x===laneX0?'M':'L') + x + ' ' + (sumCy - y * sumAmpScale).toFixed(1) + ' ';
  }
  sumWave.setAttribute('d', d);
  // spectrum (frequency): bar height = amplitude
  for (let i = 0; i < NH; i++) {
    const h = amps[i] * specMaxH;
    specBars[i].setAttribute('y', specBaseY - h);
    specBars[i].setAttribute('height', h.toFixed(1));
  }
}

// ---- presets ----
document.querySelectorAll('.preset').forEach(btn => {
  btn.onclick = () => {
    const p = btn.dataset.preset;
    if (p === 'saw')             amps = [1.0, 0.5, 0.33, 0.25]; // すべての倍音
    else if (p === 'square')     amps = [1.0, 0.0, 0.33, 0.0];  // 奇数倍音のみ
    else if (p === 'fundamental')amps = [1.0, 0, 0, 0];
    else if (p === 'clear')      amps = [0, 0, 0, 0];
    for (let i = 0; i < NH; i++) document.getElementById('amp'+i).value = amps[i]*100;
    draw(); updateAudio();
  };
});

// ---- audio ----
let audioCtx=null, oscs=[], gains=[], soundOn=false;
const F0 = 220;
const soundBtn = document.getElementById('soundBtn');
function startSound() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    for (let i=0;i<NH;i++){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=F0*(i+1);
      g.gain.value=0; o.connect(g); g.connect(audioCtx.destination); o.start();
      oscs.push(o); gains.push(g);
    }
  }
  if (audioCtx.state==='suspended') audioCtx.resume();
  soundOn=true; updateAudio();
}
function stopSound(){ soundOn=false; gains.forEach(g=>g.gain.setTargetAtTime(0,audioCtx.currentTime,0.02)); }
function updateAudio(){
  if(!soundOn||!audioCtx) return;
  for(let i=0;i<NH;i++) gains[i].gain.setTargetAtTime(amps[i]*0.18,audioCtx.currentTime,0.03);
}
soundBtn.onclick=()=>{
  if(soundOn){ stopSound(); soundBtn.textContent='🔇 音を鳴らす'; soundBtn.classList.add('off'); }
  else { startSound(); soundBtn.textContent='🔊 音 オン'; soundBtn.classList.remove('off'); }
};

draw();
</script>
</body>
</html>
