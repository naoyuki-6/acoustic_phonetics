<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3種の管の共鳴</title>
<style>
  :root{
    --bg:#eef2f3; --panel:#ffffff; --ink:#26333a; --sub:#6b7a80;
    --tube:#c9d6da; --tubewall:#8fa3aa; --air:#f5f9fa;
    --wave:#1f7a8c; --wavefill:rgba(31,122,140,0.12);
    --node:#e07a3f; --anti:#3fae7a; --closed:#4a5c63; --open:#bcd0d6;
    --accent:#1f7a8c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background:var(--bg);color:var(--ink);padding:20px;line-height:1.65;}
  .wrap{max-width:940px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.02em;}
  .lead{color:var(--sub);font-size:14px;margin:0 0 18px;}
  .tubes{display:flex;flex-direction:column;gap:14px;}
  .tube-card{background:var(--panel);border-radius:12px;padding:12px 14px 8px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .tube-head{display:flex;justify-content:space-between;align-items:baseline;
    gap:12px;margin:0 2px 4px;flex-wrap:wrap;}
  .tube-name{font-size:15px;font-weight:700;}
  .tube-name small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px;}
  .harm{font-size:13px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;}
  svg{display:block;width:100%;height:auto;}
  .controls{background:var(--panel);border-radius:12px;padding:16px 18px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);margin:16px 0;}
  .ctl-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .ctl-row + .ctl-row{margin-top:12px;}
  label.lbl{font-size:13px;color:var(--sub);min-width:120px;}
  .modebtns{display:flex;gap:8px;flex-wrap:wrap;}
  button{font-family:inherit;font-size:13px;padding:7px 14px;border-radius:8px;
    border:1px solid #cdd8dc;background:#fff;color:var(--ink);cursor:pointer;transition:.15s;}
  button:hover{background:#eef4f5;}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  input[type=range]{flex:1;min-width:160px;accent-color:var(--accent);}
  .val{font-variant-numeric:tabular-nums;font-weight:700;min-width:46px;text-align:right;}
  .toggles{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:12px;}
  .toggles label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--sub);}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:2px 2px 0;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .chip{width:12px;height:12px;border-radius:3px;display:inline-block;}
    border-radius:4px;font-size:13px;color:#2b555e;margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>3種の管の共鳴 ― 音圧の定在波で見る</h1>
  <p class="lead">閉じた端は音圧の腹（大きく変動）、開いた端は音圧の節（ほぼ0）。この端の条件の違いで、基本振動の形と共鳴周波数の並びが変わる。</p>

  <div class="legend">
    <span><span class="chip" style="background:var(--closed)"></span>閉じた端 → 音圧の腹</span>
    <span><span class="chip" style="background:var(--open)"></span>開いた端 → 音圧の節（≈0）</span>
    <span><span class="chip" style="background:var(--node)"></span>節（揺れない）</span>
    <span><span class="chip" style="background:var(--anti)"></span>腹（大きく揺れる）</span>
  </div>

  <div class="tubes" style="margin-top:12px;">
    <div class="tube-card">
      <div class="tube-head">
        <div class="tube-name">両端開管 <small>両端が開いている（例：フルート）</small></div>
        <div class="harm" id="h-open"></div>
      </div>
      <svg id="svg-open" viewBox="0 0 900 150" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div class="tube-card">
      <div class="tube-head">
        <div class="tube-name">両端閉管 <small>両端が閉じている</small></div>
        <div class="harm" id="h-closed"></div>
      </div>
      <svg id="svg-closed" viewBox="0 0 900 150" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div class="tube-card">
      <div class="tube-head">
        <div class="tube-name">片端閉管 <small>片方だけ閉じている（声道のモデル）</small></div>
        <div class="harm" id="h-half"></div>
      </div>
      <svg id="svg-half" viewBox="0 0 900 150" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>

  <div class="controls">
    <div class="ctl-row">
      <label class="lbl">共鳴の次数</label>
      <div class="modebtns" id="orderBtns">
        <button data-o="1" class="on">基本振動（第1共鳴）</button>
        <button data-o="2">第2共鳴</button>
        <button data-o="3">第3共鳴</button>
        <button data-o="4">第4共鳴</button>
      </div>
    </div>
    <div class="ctl-row">
      <label class="lbl">アニメーション</label>
      <button id="play" class="on">⏸ 一時停止</button>
      <input type="range" id="speed" min="0" max="100" value="45">
      <div class="val"><span id="speedVal">45</span>%</div>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="tMark" checked> 節・腹に印</label>
      <label><input type="checkbox" id="tEnv" checked> 振幅の入れ物（包絡線）</label>
    </div>
  </div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const VW=900, VH=150;
const PADX=70;                 // room for end caps + labels
const x0=PADX, x1=VW-PADX;     // tube interior span
const LEN=x1-x0;
const yMid=VH/2;
const AMP=42;

const svgO=document.getElementById('svg-open');
const svgC=document.getElementById('svg-closed');
const svgH=document.getElementById('svg-half');

let order=1, t=0, playing=true, last=null, raf=null;
const ui={
  play:document.getElementById('play'),
  speed:document.getElementById('speed'),
  speedVal:document.getElementById('speedVal'),
  tMark:document.getElementById('tMark'),
  tEnv:document.getElementById('tEnv'),
};

function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e;}
function clear(s){while(s.firstChild)s.removeChild(s.firstChild);}

// pressure shape functions, x in [0,1]; return value in [-1,1]
// open end = node (p=0), closed end = antinode (|p|=1)
// type: 'open' (node-node), 'closed' (antinode-antinode), 'half' (antinode at left, node at right)
function shape(type, n, xn){
  if(type==='open')   return Math.sin(n*Math.PI*xn);
  if(type==='closed') return Math.cos(n*Math.PI*xn);
  // half: odd multiples of quarter wave
  return Math.cos((2*n-1)*Math.PI/2*xn);
}
// harmonic multiple label for a given type & selected order
function multiple(type, n){
  if(type==='half') return 2*n-1;   // 1,3,5,7
  return n;                          // 1,2,3,4
}

function drawTube(svg, type){
  clear(svg);
  // tube body
  svg.appendChild(el('rect',{x:x0,y:yMid-AMP-12,width:LEN,height:2*(AMP+12),
    rx:6,fill:'var(--air)',stroke:'var(--tubewall)','stroke-width':1.5}));
  // end caps: closed = solid wall, open = light/gap
  function cap(xpos, closed){
    if(closed){
      svg.appendChild(el('rect',{x:xpos-6,y:yMid-AMP-14,width:8,height:2*(AMP+14),
        rx:2,fill:'var(--closed)'}));
    }else{
      // open: draw faint gradient bars to suggest opening to atmosphere
      for(let i=0;i<3;i++){
        svg.appendChild(el('line',{x1:xpos-2+i*3,y1:yMid-AMP-10,x2:xpos-2+i*3,y2:yMid+AMP+10,
          stroke:'var(--open)','stroke-width':2,opacity:0.7-i*0.2}));
      }
    }
  }
  const leftClosed = (type==='closed'||type==='half');
  const rightClosed = (type==='closed');
  cap(x0,leftClosed);
  cap(x1,rightClosed);

  // centerline
  svg.appendChild(el('line',{x1:x0,y1:yMid,x2:x1,y2:yMid,stroke:'#cdd8dc','stroke-width':1}));

  const n=order;
  const A=AMP*Math.cos(t);   // time modulation (all points scale together)

  // envelope
  if(ui.tEnv.checked){
    let up='',dn='';
    for(let i=0;i<=200;i++){
      const xn=i/200, xp=x0+xn*LEN;
      const env=Math.abs(AMP*shape(type,n,xn));
      up+=(i===0?'M':'L')+xp.toFixed(1)+' '+(yMid-env).toFixed(1)+' ';
      dn+=(i===0?'M':'L')+xp.toFixed(1)+' '+(yMid+env).toFixed(1)+' ';
    }
    svg.appendChild(el('path',{d:up,fill:'none',stroke:'#b9d4d9','stroke-width':1.2,'stroke-dasharray':'4 4'}));
    svg.appendChild(el('path',{d:dn,fill:'none',stroke:'#b9d4d9','stroke-width':1.2,'stroke-dasharray':'4 4'}));
  }

  // instantaneous pressure curve (filled)
  let d='M'+x0+' '+yMid+' ';
  for(let i=0;i<=200;i++){
    const xn=i/200, xp=x0+xn*LEN;
    const y=yMid - A*shape(type,n,xn);
    d+='L'+xp.toFixed(1)+' '+y.toFixed(1)+' ';
  }
  d+='L'+x1+' '+yMid+' Z';
  svg.appendChild(el('path',{d,fill:'var(--wavefill)',stroke:'none'}));
  // line on top
  let dl='';
  for(let i=0;i<=200;i++){
    const xn=i/200, xp=x0+xn*LEN;
    const y=yMid - A*shape(type,n,xn);
    dl+=(i===0?'M':'L')+xp.toFixed(1)+' '+y.toFixed(1)+' ';
  }
  svg.appendChild(el('path',{d:dl,fill:'none',stroke:'var(--wave)','stroke-width':2.4}));

  // node / antinode markers — computed analytically from the mode shape
  if(ui.tMark.checked){
    let nodes=[], antis=[];
    if(type==='open'){
      // sin(n*pi*x): nodes at x=j/n (j=0..n), antinodes at x=(j+0.5)/n (j=0..n-1)
      for(let j=0;j<=n;j++) nodes.push(j/n);
      for(let j=0;j<n;j++) antis.push((j+0.5)/n);
    }else if(type==='closed'){
      // cos(n*pi*x): antinodes at x=j/n (j=0..n), nodes at x=(j+0.5)/n
      for(let j=0;j<=n;j++) antis.push(j/n);
      for(let j=0;j<n;j++) nodes.push((j+0.5)/n);
    }else{
      // half: cos((2n-1)*pi/2 * x). Let M=2n-1.
      // antinodes where (2n-1)/2 * x = integer j -> x = 2j/M, j=0..(n-1) [x in 0..1]
      // nodes where argument = (j+0.5)*pi -> x = (2j+1)/M, j=0..(n-1)
      const M=2*n-1;
      for(let j=0;2*j<=M;j++){const x=2*j/M; if(x<=1.0001) antis.push(x);}
      for(let j=0;(2*j+1)<=M;j++){const x=(2*j+1)/M; if(x<=1.0001) nodes.push(x);}
    }
    antis.forEach(xn=>{
      const xp=x0+xn*LEN;
      svg.appendChild(el('line',{x1:xp,y1:yMid-AMP,x2:xp,y2:yMid+AMP,
        stroke:'var(--anti)','stroke-width':1.2,'stroke-dasharray':'2 3',opacity:0.55}));
    });
    nodes.forEach(xn=>{
      const xp=x0+xn*LEN;
      svg.appendChild(el('circle',{cx:xp,cy:yMid,r:4,fill:'var(--node)'}));
    });
  }

  // end labels
  function endLabel(xpos, txt, anchor){
    const tx=el('text',{x:xpos,y:yMid+AMP+30,'font-size':11,fill:'var(--sub)','text-anchor':anchor});
    tx.textContent=txt; svg.appendChild(tx);
  }
  endLabel(x0, leftClosed?'閉（腹）':'開（節）','middle');
  endLabel(x1, rightClosed?'閉（腹）':'開（節）','middle');
}

function refresh(){
  drawTube(svgO,'open');
  drawTube(svgC,'closed');
  drawTube(svgH,'half');
  document.getElementById('h-open').textContent   = '基本の '+multiple('open',order)+' 倍（整数倍：1,2,3,4…）';
  document.getElementById('h-closed').textContent = '基本の '+multiple('closed',order)+' 倍（整数倍：1,2,3,4…）';
  document.getElementById('h-half').textContent   = '基本の '+multiple('half',order)+' 倍（奇数倍：1,3,5,7…）';
}

// animation loop
function frame(ts){
  if(!last)last=ts;
  const dt=(ts-last)/1000; last=ts;
  if(playing){ t += dt*2.4*(parseInt(ui.speed.value)/100)*Math.PI; }
  drawTube(svgO,'open'); drawTube(svgC,'closed'); drawTube(svgH,'half');
  raf=requestAnimationFrame(frame);
}

// order buttons
document.getElementById('orderBtns').addEventListener('click',(e)=>{
  const b=e.target.closest('button'); if(!b)return;
  order=parseInt(b.dataset.o);
  [...document.querySelectorAll('#orderBtns button')].forEach(x=>x.classList.toggle('on',x===b));
  refresh();
});
ui.play.addEventListener('click',()=>{
  playing=!playing;
  ui.play.textContent=playing?'⏸ 一時停止':'▶ 再生';
  ui.play.classList.toggle('on',playing);
});
ui.speed.addEventListener('input',()=>ui.speedVal.textContent=ui.speed.value);
ui.tMark.addEventListener('input',refresh);
ui.tEnv.addEventListener('input',refresh);

refresh();
raf=requestAnimationFrame(frame);
</script>
</body>
</html>
